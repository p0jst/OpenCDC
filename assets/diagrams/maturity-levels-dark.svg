<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" width="760" height="350" role="img" aria-labelledby="title desc" font-family="'IBM Plex Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="title">The four maturity levels</title>
<desc id="desc">A staircase of four levels. Level 1, Initial: it happens when someone remembers. Level 2, Managed: it is written down and someone owns it; Level 2 is also the NIS2 floor. Level 3, Established: it is measured and consistent. Level 4, Optimising: it improves itself. Scoring is staged: a level counts only when all its criteria, and those of the levels below, are met.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa7b4"/></marker><marker id="arr-eu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8fb3e3"/></marker></defs>
<rect x="20" y="190" width="176" height="110" rx="6" fill="#26354a" stroke="#8fb3e3" stroke-width="1.5"/>
<text x="34" y="216" font-size="15" font-weight="700" fill="#e6edf3" text-anchor="start">Level 1</text>
<text x="34" y="236" font-size="13" font-weight="600" fill="#9aa7b4" text-anchor="start">Initial</text>
<text x="34" y="262" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start" font-style="italic">It happens when</text>
<text x="34" y="280" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start" font-style="italic">someone remembers.</text>
<rect x="205" y="140" width="176" height="160" rx="6" fill="#3a2329" stroke="#e39aa4" stroke-width="2"/>
<text x="293.0" y="128" font-size="13" font-weight="700" fill="#e39aa4" text-anchor="middle">NIS2 floor</text>
<text x="219" y="166" font-size="15" font-weight="700" fill="#e6edf3" text-anchor="start">Level 2</text>
<text x="219" y="186" font-size="13" font-weight="600" fill="#9aa7b4" text-anchor="start">Managed</text>
<text x="219" y="212" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start" font-style="italic">It is written down</text>
<text x="219" y="230" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start" font-style="italic">and someone owns it.</text>
<rect x="390" y="90" width="176" height="210" rx="6" fill="#26354a" stroke="#8fb3e3" stroke-width="1.5"/>
<text x="404" y="116" font-size="15" font-weight="700" fill="#e6edf3" text-anchor="start">Level 3</text>
<text x="404" y="136" font-size="13" font-weight="600" fill="#9aa7b4" text-anchor="start">Established</text>
<text x="404" y="162" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start" font-style="italic">It is measured</text>
<text x="404" y="180" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start" font-style="italic">and consistent.</text>
<rect x="575" y="40" width="176" height="260" rx="6" fill="#26354a" stroke="#8fb3e3" stroke-width="1.5"/>
<text x="589" y="66" font-size="15" font-weight="700" fill="#e6edf3" text-anchor="start">Level 4</text>
<text x="589" y="86" font-size="13" font-weight="600" fill="#9aa7b4" text-anchor="start">Optimising</text>
<text x="589" y="112" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start" font-style="italic">It improves</text>
<text x="589" y="130" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start" font-style="italic">itself.</text>
<path d="M20,314 L751,314" fill="none" stroke="#9aa7b4" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="20" y="340" font-size="12" font-weight="400" fill="#9aa7b4" text-anchor="start">Staged scoring: a level counts only when all its criteria, and those of the levels below, are met.</text>
</svg>
