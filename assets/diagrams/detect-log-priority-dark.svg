<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" width="760" height="350" role="img" aria-labelledby="title desc" font-family="'IBM Plex Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="title">Log source onboarding priority</title>
<desc id="desc">Onboard log sources in this order: identity, endpoint, email and web, cloud control plane, network, then critical applications. The first three are the DETECT Level 2 minimum. Network moves up the list the more unmanaged devices and flat legacy segments you have.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa7b4"/></marker><marker id="arr-eu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8fb3e3"/></marker></defs>
<rect x="150" y="30" width="360" height="40" rx="5" fill="#8fb3e3"/>
<text x="166" y="56" font-size="14" font-weight="700" fill="#0d1720" text-anchor="start">1. Identity</text>
<text x="522" y="55" font-size="13" font-weight="400" fill="#9aa7b4" text-anchor="start">directory, IdP, privileged actions</text>
<rect x="150" y="80" width="334" height="40" rx="5" fill="#8fb3e3"/>
<text x="166" y="106" font-size="14" font-weight="700" fill="#0d1720" text-anchor="start">2. Endpoint</text>
<text x="496" y="105" font-size="13" font-weight="400" fill="#9aa7b4" text-anchor="start">EDR: process and lateral movement</text>
<rect x="150" y="130" width="308" height="40" rx="5" fill="#8fb3e3"/>
<text x="166" y="156" font-size="14" font-weight="700" fill="#0d1720" text-anchor="start">3. Email and web</text>
<text x="470" y="155" font-size="13" font-weight="400" fill="#9aa7b4" text-anchor="start">the dominant ways in</text>
<rect x="150" y="180" width="282" height="40" rx="5" fill="#26354a" stroke="#8fb3e3" stroke-width="1.5"/>
<text x="166" y="206" font-size="14" font-weight="700" fill="#e6edf3" text-anchor="start">4. Cloud control plane</text>
<text x="444" y="205" font-size="13" font-weight="400" fill="#9aa7b4" text-anchor="start">IaaS and SaaS audit logs</text>
<rect x="150" y="230" width="256" height="40" rx="5" fill="#26354a" stroke="#8fb3e3" stroke-width="1.5"/>
<text x="166" y="256" font-size="14" font-weight="700" fill="#e6edf3" text-anchor="start">5. Network</text>
<text x="418" y="255" font-size="13" font-weight="400" fill="#9aa7b4" text-anchor="start">firewall, DNS, VPN, flows, NDR</text>
<rect x="150" y="280" width="230" height="40" rx="5" fill="#26354a" stroke="#8fb3e3" stroke-width="1.5"/>
<text x="166" y="306" font-size="14" font-weight="700" fill="#e6edf3" text-anchor="start">6. Critical applications</text>
<text x="392" y="305" font-size="13" font-weight="400" fill="#9aa7b4" text-anchor="start">crown-jewel specific</text>
<path d="M136,30 L128,30 L128,170 L136,170" fill="none" stroke="#e39aa4" stroke-width="2"/>
<text x="118" y="88" font-size="13" font-weight="700" fill="#e39aa4" text-anchor="end">Level 2</text>
<text x="118" y="106" font-size="13" font-weight="700" fill="#e39aa4" text-anchor="end">minimum</text>
<text x="150" y="342" font-size="12" font-weight="400" fill="#9aa7b4" text-anchor="start">Network climbs the list the more unmanaged devices and flat segments you have.</text>
</svg>
