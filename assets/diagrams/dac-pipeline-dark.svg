<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="title desc" font-family="'IBM Plex Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="title">The detection-as-code pipeline</title>
<desc id="desc">Every merge to main runs four stages: lint and schema validation, unit tests, conversion to the platform&#x27;s query language, and a staging deploy with a volume smoke test. Errors in the first three stages fail the build. Production deploy follows through the platform API, then a nightly drift check compares the platform with the repository, and emulation validation runs on a schedule to confirm alerts fire end to end. Adopt stages 1 to 3 first, then 5 and 6, then 7.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa7b4"/></marker><marker id="arr-eu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8fb3e3"/></marker></defs>
<text x="10" y="30" font-size="13" font-weight="600" fill="#9aa7b4" text-anchor="start">Every merge to main</text>
<rect x="6" y="48" width="558" height="96" rx="8" fill="#3a2329"/>
<text x="16" y="138" font-size="12" font-weight="600" fill="#e39aa4" text-anchor="start">An error here fails the build</text>
<rect x="10" y="56" width="172" height="62" rx="6" fill="#1a242f" stroke="#3a4a5b" stroke-width="1.5"/>
<text x="96.0" y="84.0" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">1. Lint and schema</text>
<text x="96.0" y="102.0" font-size="12" font-weight="400" fill="#9aa7b4" text-anchor="middle">fields, UUID, ATT&amp;CK IDs</text>
<rect x="199" y="56" width="172" height="62" rx="6" fill="#1a242f" stroke="#3a4a5b" stroke-width="1.5"/>
<text x="285.0" y="84.0" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">2. Unit tests</text>
<text x="285.0" y="102.0" font-size="12" font-weight="400" fill="#9aa7b4" text-anchor="middle">should fire, should not</text>
<path d="M183,87.0 L197,87.0" fill="none" stroke="#9aa7b4" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="388" y="56" width="172" height="62" rx="6" fill="#1a242f" stroke="#3a4a5b" stroke-width="1.5"/>
<text x="474.0" y="84.0" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">3. Conversion</text>
<text x="474.0" y="102.0" font-size="12" font-weight="400" fill="#9aa7b4" text-anchor="middle">Sigma to platform query</text>
<path d="M372,87.0 L386,87.0" fill="none" stroke="#9aa7b4" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="577" y="56" width="172" height="62" rx="6" fill="#1a242f" stroke="#3a4a5b" stroke-width="1.5"/>
<text x="663.0" y="84.0" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">4. Staging deploy</text>
<text x="663.0" y="102.0" font-size="12" font-weight="400" fill="#9aa7b4" text-anchor="middle">volume smoke test</text>
<path d="M561,87.0 L575,87.0" fill="none" stroke="#9aa7b4" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="108.0" y="162" font-size="13" font-weight="600" fill="#9aa7b4" text-anchor="start">After the merge</text>
<rect x="10" y="192" width="172" height="62" rx="6" fill="#1a242f" stroke="#3a4a5b" stroke-width="1.5"/>
<text x="96.0" y="220.0" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">5. Production deploy</text>
<text x="96.0" y="238.0" font-size="12" font-weight="400" fill="#9aa7b4" text-anchor="middle">via API, ids recorded</text>
<rect x="199" y="192" width="172" height="62" rx="6" fill="#1a242f" stroke="#3a4a5b" stroke-width="1.5"/>
<text x="285.0" y="220.0" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">6. Drift detection</text>
<text x="285.0" y="238.0" font-size="12" font-weight="400" fill="#9aa7b4" text-anchor="middle">nightly diff with repo</text>
<path d="M183,223.0 L197,223.0" fill="none" stroke="#9aa7b4" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="388" y="192" width="172" height="62" rx="6" fill="#1a242f" stroke="#8fb3e3" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="474.0" y="220.0" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">7. Emulation</text>
<text x="474.0" y="238.0" font-size="12" font-weight="400" fill="#9aa7b4" text-anchor="middle">scheduled, end to end</text>
<path d="M372,223.0 L386,223.0" fill="none" stroke="#9aa7b4" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#arr)"/>
<path d="M663.0,118 L663.0,168 L96.0,168 L96.0,190" fill="none" stroke="#9aa7b4" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="577" y="212" font-size="12" font-weight="600" fill="#9aa7b4" text-anchor="start">Adopt in this order:</text>
<text x="577" y="230" font-size="12" font-weight="400" fill="#9aa7b4" text-anchor="start">stages 1 to 3 first,</text>
<text x="577" y="248" font-size="12" font-weight="400" fill="#9aa7b4" text-anchor="start">then 5 and 6, then 7.</text>
<text x="10" y="286" font-size="12" font-weight="400" fill="#9aa7b4" text-anchor="start">Dashed: runs on a schedule, not on every merge.</text>
</svg>
