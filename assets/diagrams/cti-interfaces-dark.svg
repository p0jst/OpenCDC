<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="title desc" font-family="'IBM Plex Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="title">How CTI feeds the rest of the CDC</title>
<desc id="desc">Threat intelligence sits in the middle and feeds six consumers through standing, ticketed workflows: detection engineering gets detection opportunities, threat hunting gets hypotheses, vulnerability management gets exploitation-aware priorities, incident response gets actor context on request, tactical triage gets curated indicators with expiry, and GOVERN gets a quarterly threat briefing. Every consumer reports back what was used and what was noise.</desc>
