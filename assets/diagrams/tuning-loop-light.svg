<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img" aria-labelledby="title desc" font-family="'IBM Plex Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="title">The alert tuning loop</title>
<desc id="desc">A weekly loop of five steps: measure each use case; every closed alert carries a verdict and every false positive a reason; a weekly tuning review of the worst offenders; every change made as a reviewed commit; then the test is fired again to prove detection still works, and measuring starts over. Two standing rules sit beside the loop: suppressions carry an owner and an expiry date, and rules that never fire and fail validation are fixed or retired.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d6975"/></marker><marker id="arr-eu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#123a6d"/></marker></defs>
<rect x="250" y="30" width="260" height="62" rx="6" fill="#e8eef7" stroke="#123a6d" stroke-width="1.5"/>
<text x="380.0" y="58.0" font-size="14" font-weight="600" fill="#1d2733" text-anchor="middle">Measure</text>
<text x="380.0" y="76.0" font-size="12" font-weight="400" fill="#5d6975" text-anchor="middle">alerts, true positives, time</text>
<rect x="480" y="125" width="260" height="62" rx="6" fill="#e8eef7" stroke="#123a6d" stroke-width="1.5"/>
<text x="610.0" y="153.0" font-size="14" font-weight="600" fill="#1d2733" text-anchor="middle">Verdict on every alert</text>
<text x="610.0" y="171.0" font-size="12" font-weight="400" fill="#5d6975" text-anchor="middle">and a reason on every FP</text>
<rect x="410" y="270" width="260" height="62" rx="6" fill="#e8eef7" stroke="#123a6d" stroke-width="1.5"/>
<text x="540.0" y="298.0" font-size="14" font-weight="600" fill="#1d2733" text-anchor="middle">Weekly tuning review</text>
<text x="540.0" y="316.0" font-size="12" font-weight="400" fill="#5d6975" text-anchor="middle">worst offenders, 30–60 min</text>
<rect x="90" y="270" width="260" height="62" rx="6" fill="#e8eef7" stroke="#123a6d" stroke-width="1.5"/>
<text x="220.0" y="298.0" font-size="14" font-weight="600" fill="#1d2733" text-anchor="middle">Change as a reviewed commit</text>
<text x="220.0" y="316.0" font-size="12" font-weight="400" fill="#5d6975" text-anchor="middle">with the reason written down</text>
<rect x="20" y="125" width="260" height="62" rx="6" fill="#e8eef7" stroke="#123a6d" stroke-width="1.5"/>
<text x="150.0" y="153.0" font-size="14" font-weight="600" fill="#1d2733" text-anchor="middle">Fire the test again</text>
<text x="150.0" y="171.0" font-size="12" font-weight="400" fill="#5d6975" text-anchor="middle">tuning must not blind the rule</text>
<path d="M510,61 L600,61 L600,123" fill="none" stroke="#123a6d" stroke-width="1.8" marker-end="url(#arr-eu)"/>
<path d="M610,187 L610,268" fill="none" stroke="#123a6d" stroke-width="1.8" marker-end="url(#arr-eu)"/>
<path d="M410,301 L352,301" fill="none" stroke="#123a6d" stroke-width="1.8" marker-end="url(#arr-eu)"/>
<path d="M150,270 L150,189" fill="none" stroke="#123a6d" stroke-width="1.8" marker-end="url(#arr-eu)"/>
<path d="M150,125 L150,61 L248,61" fill="none" stroke="#123a6d" stroke-width="1.8" marker-end="url(#arr-eu)"/>
<text x="380" y="175" font-size="16" font-weight="700" fill="#123a6d" text-anchor="middle">Weekly</text>
<text x="380" y="196" font-size="13" font-weight="400" fill="#5d6975" text-anchor="middle">every closed alert feeds it</text>
<rect x="20" y="360" width="350" height="52" rx="6" fill="#ffffff" stroke="#d9d3c4" stroke-width="1.5"/>
<text x="34" y="382" font-size="13" font-weight="600" fill="#1d2733" text-anchor="start">Suppressions carry an owner and an expiry;</text>
<text x="34" y="400" font-size="13" font-weight="400" fill="#5d6975" text-anchor="start">expired ones come back for review</text>
<rect x="390" y="360" width="350" height="52" rx="6" fill="#ffffff" stroke="#d9d3c4" stroke-width="1.5"/>
<text x="404" y="382" font-size="13" font-weight="600" fill="#1d2733" text-anchor="start">A rule that never fires and fails validation</text>
<text x="404" y="400" font-size="13" font-weight="400" fill="#5d6975" text-anchor="start">is fixed or retired, not kept just in case</text>
</svg>
