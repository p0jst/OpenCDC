<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" width="760" height="600" role="img" aria-labelledby="title desc" font-family="'IBM Plex Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="title">Choosing an operating model: the decision path</title>
<desc id="desc">Five questions in order. 1: must log data stay in the organisation or country? If yes, keep those sources in-house. 2: need out-of-hours detection within six months? If yes, start with a provider and contract for exit, then continue. 3: can you hire and keep the 9 to 10 people a 24/7 seat takes? If no, a provider or your operations desk holds nights. 4: can you hire 5 to 8 senior engineers? Yes: capability-based, model C. Juniors only: tiered, model B. Neither: provider, model A. 5: does triage need deep business knowledge? If yes, keep that triage in-house whatever the model.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa7b4"/></marker><marker id="arr-eu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8fb3e3"/></marker></defs>
<rect x="20" y="20" width="360" height="64" rx="6" fill="#1a242f" stroke="#3a4a5b" stroke-width="1.5"/>
<circle cx="52" cy="52" r="16" fill="#8fb3e3"/>
<text x="52" y="57" font-size="15" font-weight="700" fill="#0d1720" text-anchor="middle">1</text>
<text x="82" y="47" font-size="15" font-weight="600" fill="#e6edf3" text-anchor="start">Must any log data stay in the</text>
<text x="82" y="67" font-size="15" font-weight="600" fill="#e6edf3" text-anchor="start">organisation or the country?</text>
<rect x="20" y="112" width="360" height="64" rx="6" fill="#1a242f" stroke="#3a4a5b" stroke-width="1.5"/>
<circle cx="52" cy="144" r="16" fill="#8fb3e3"/>
<text x="52" y="149" font-size="15" font-weight="700" fill="#0d1720" text-anchor="middle">2</text>
<text x="82" y="139" font-size="15" font-weight="600" fill="#e6edf3" text-anchor="start">Do you need out-of-hours</text>
<text x="82" y="159" font-size="15" font-weight="600" fill="#e6edf3" text-anchor="start">detection within six months?</text>
<rect x="20" y="204" width="360" height="64" rx="6" fill="#1a242f" stroke="#3a4a5b" stroke-width="1.5"/>
<circle cx="52" cy="236" r="16" fill="#8fb3e3"/>
<text x="52" y="241" font-size="15" font-weight="700" fill="#0d1720" text-anchor="middle">3</text>
<text x="82" y="231" font-size="15" font-weight="600" fill="#e6edf3" text-anchor="start">Can you hire and keep the 9–10</text>
<text x="82" y="251" font-size="15" font-weight="600" fill="#e6edf3" text-anchor="start">people one 24/7 seat takes?</text>
<rect x="20" y="360" width="360" height="64" rx="6" fill="#1a242f" stroke="#3a4a5b" stroke-width="1.5"/>
<circle cx="52" cy="392" r="16" fill="#8fb3e3"/>
<text x="52" y="397" font-size="15" font-weight="700" fill="#0d1720" text-anchor="middle">4</text>
<text x="82" y="387" font-size="15" font-weight="600" fill="#e6edf3" text-anchor="start">Can you hire 5–8 senior people</text>
<text x="82" y="407" font-size="15" font-weight="600" fill="#e6edf3" text-anchor="start">who work with code and automation?</text>
<rect x="20" y="516" width="360" height="64" rx="6" fill="#1a242f" stroke="#3a4a5b" stroke-width="1.5"/>
<circle cx="52" cy="548" r="16" fill="#8fb3e3"/>
<text x="52" y="553" font-size="15" font-weight="700" fill="#0d1720" text-anchor="middle">5</text>
<text x="82" y="543" font-size="15" font-weight="600" fill="#e6edf3" text-anchor="start">Does triage need deep</text>
<text x="82" y="563" font-size="15" font-weight="600" fill="#e6edf3" text-anchor="start">business knowledge?</text>
<path d="M200,84 L200,110" fill="none" stroke="#9aa7b4" stroke-width="1.6" marker-end="url(#arr)"/>
<path d="M200,176 L200,202" fill="none" stroke="#9aa7b4" stroke-width="1.6" marker-end="url(#arr)"/>
<path d="M200,268 L200,358" fill="none" stroke="#9aa7b4" stroke-width="1.6" marker-end="url(#arr)"/>
<path d="M200,424 L200,514" fill="none" stroke="#9aa7b4" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="470" y="26" width="270" height="52" rx="6" fill="#26354a" stroke="#8fb3e3" stroke-width="1.2"/>
<rect x="484" y="39" width="21" height="26" rx="13" fill="#8fb3e3"/>
<text x="494.5" y="57" font-size="13" font-weight="700" fill="#0d1720" text-anchor="middle">B</text>
<rect x="511" y="39" width="21" height="26" rx="13" fill="#8fb3e3"/>
<text x="521.5" y="57" font-size="13" font-weight="700" fill="#0d1720" text-anchor="middle">C</text>
<text x="542" y="48" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="start">Keep those in-house</text>
<text x="542" y="66" font-size="13" font-weight="400" fill="#9aa7b4" text-anchor="start">a provider may watch the rest</text>
<path d="M380,52 L468,52" fill="none" stroke="#9aa7b4" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="428" y="46" font-size="13" font-weight="600" fill="#8fb3e3" text-anchor="start">Yes</text>
<rect x="470" y="118" width="270" height="52" rx="6" fill="#26354a" stroke="#8fb3e3" stroke-width="1.2"/>
<rect x="484" y="131" width="21" height="26" rx="13" fill="#8fb3e3"/>
<text x="494.5" y="149" font-size="13" font-weight="700" fill="#0d1720" text-anchor="middle">A</text>
<rect x="511" y="131" width="39" height="26" rx="13" fill="#8fb3e3"/>
<text x="530.5" y="149" font-size="13" font-weight="700" fill="#0d1720" text-anchor="middle">A+C</text>
<text x="560" y="140" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="start">Start with a provider</text>
<text x="560" y="158" font-size="13" font-weight="400" fill="#9aa7b4" text-anchor="start">contract for exit first</text>
<path d="M380,144 L468,144" fill="none" stroke="#9aa7b4" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="428" y="138" font-size="13" font-weight="600" fill="#8fb3e3" text-anchor="start">Yes</text>
<rect x="470" y="210" width="270" height="52" rx="6" fill="#26354a" stroke="#8fb3e3" stroke-width="1.2"/>
<rect x="484" y="223" width="21" height="26" rx="13" fill="#8fb3e3"/>
<text x="494.5" y="241" font-size="13" font-weight="700" fill="#0d1720" text-anchor="middle">A</text>
<rect x="511" y="223" width="39" height="26" rx="13" fill="#8fb3e3"/>
<text x="530.5" y="241" font-size="13" font-weight="700" fill="#0d1720" text-anchor="middle">A+C</text>
<text x="560" y="232" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="start">Provider holds nights</text>
<text x="560" y="250" font-size="13" font-weight="400" fill="#9aa7b4" text-anchor="start">or a 24/7 operations desk</text>
<path d="M380,236 L468,236" fill="none" stroke="#9aa7b4" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="428" y="230" font-size="13" font-weight="600" fill="#8fb3e3" text-anchor="start">No</text>
<rect x="470" y="306" width="270" height="52" rx="6" fill="#26354a" stroke="#8fb3e3" stroke-width="1.2"/>
<rect x="484" y="319" width="21" height="26" rx="13" fill="#8fb3e3"/>
<text x="494.5" y="337" font-size="13" font-weight="700" fill="#0d1720" text-anchor="middle">C</text>
<text x="515" y="328" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="start">Capability-based team</text>
<text x="515" y="346" font-size="13" font-weight="400" fill="#9aa7b4" text-anchor="start">provider or on-call at night</text>
<rect x="470" y="366" width="270" height="52" rx="6" fill="#26354a" stroke="#8fb3e3" stroke-width="1.2"/>
<rect x="484" y="379" width="21" height="26" rx="13" fill="#8fb3e3"/>
<text x="494.5" y="397" font-size="13" font-weight="700" fill="#0d1720" text-anchor="middle">B</text>
<text x="515" y="388" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="start">Tiered SOC</text>
<text x="515" y="406" font-size="13" font-weight="400" fill="#9aa7b4" text-anchor="start">juniors trained up the tiers</text>
<rect x="470" y="426" width="270" height="52" rx="6" fill="#26354a" stroke="#8fb3e3" stroke-width="1.2"/>
<rect x="484" y="439" width="21" height="26" rx="13" fill="#8fb3e3"/>
<text x="494.5" y="457" font-size="13" font-weight="700" fill="#0d1720" text-anchor="middle">A</text>
<text x="515" y="448" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="start">Provider</text>
<text x="515" y="466" font-size="13" font-weight="400" fill="#9aa7b4" text-anchor="start">with 1–3 internal people</text>
<path d="M380,392 L420,392" fill="none" stroke="#9aa7b4" stroke-width="1.6" marker-end="url(#arr)"/>
<path d="M420,392 L420,332 L468,332" fill="none" stroke="#9aa7b4" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="428" y="326" font-size="13" font-weight="600" fill="#8fb3e3" text-anchor="start">Yes</text>
<path d="M420,392 L420,392 L468,392" fill="none" stroke="#9aa7b4" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="428" y="386" font-size="13" font-weight="600" fill="#8fb3e3" text-anchor="start">Juniors</text>
<path d="M420,392 L420,452 L468,452" fill="none" stroke="#9aa7b4" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="428" y="446" font-size="13" font-weight="600" fill="#8fb3e3" text-anchor="start">Neither</text>
<rect x="470" y="522" width="270" height="52" rx="6" fill="#3a2329" stroke="#e39aa4" stroke-width="1.2"/>
<text x="484" y="544" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="start">Keep that triage in-house</text>
<text x="484" y="562" font-size="13" font-weight="400" fill="#9aa7b4" text-anchor="start">whatever the model</text>
<path d="M380,548 L468,548" fill="none" stroke="#9aa7b4" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="428" y="542" font-size="13" font-weight="600" fill="#e39aa4" text-anchor="start">Yes</text>
</svg>
