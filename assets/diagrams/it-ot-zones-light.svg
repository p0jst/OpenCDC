<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="760" height="520" role="img" aria-labelledby="title desc" font-family="'IBM Plex Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="title">The IT/OT boundary: who watches and who decides</title>
<desc id="desc">Three zones. In IT, the CDC decides and acts within its mandate. In the boundary zone, meaning the IT/OT DMZ and firewalls, jump hosts and remote access, engineering workstations, historians and data diodes, file transfer and update servers, shared identity and backups of OT configurations, the CDC monitors and ownership is agreed jointly. In OT, the operator decides and the CDC advises. Containment decisions move from the CDC to the operator: supplier remote access and IT accounts with DMZ access are the CDC&#x27;s call; blocking a conduit needs OT approval; isolating an engineering workstation is OT&#x27;s call, advised by the CDC; separating IT from OT is for OT management; any action on an OT asset follows the vendor procedure. One reporting owner per incident, and the clock starts at awareness on either side.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d6975"/></marker><marker id="arr-eu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#123a6d"/></marker></defs>
<rect x="20" y="20" width="200" height="250" rx="6" fill="#ffffff" stroke="#d9d3c4" stroke-width="1.5"/>
<text x="36" y="48" font-size="16" font-weight="700" fill="#1d2733" text-anchor="start">IT</text>
<text x="36" y="68" font-size="13" font-weight="400" fill="#5d6975" text-anchor="start">The CDC decides and acts</text>
<circle cx="41" cy="96" r="3" fill="#5d6975"/>
<text x="52" y="100" font-size="13" font-weight="400" fill="#1d2733" text-anchor="start">Endpoints and servers</text>
<circle cx="41" cy="119" r="3" fill="#5d6975"/>
<text x="52" y="123" font-size="13" font-weight="400" fill="#1d2733" text-anchor="start">Identity and cloud</text>
<circle cx="41" cy="142" r="3" fill="#5d6975"/>
<text x="52" y="146" font-size="13" font-weight="400" fill="#1d2733" text-anchor="start">Mail and web</text>
<rect x="240" y="20" width="280" height="250" rx="6" fill="#e8eef7" stroke="#123a6d" stroke-width="1.5"/>
<text x="256" y="48" font-size="16" font-weight="700" fill="#123a6d" text-anchor="start">Boundary zone</text>
<text x="256" y="68" font-size="13" font-weight="400" fill="#5d6975" text-anchor="start">The CDC monitors; owners agreed</text>
<circle cx="261" cy="96" r="3" fill="#123a6d"/>
<text x="272" y="100" font-size="13" font-weight="400" fill="#1d2733" text-anchor="start">IT/OT DMZ and firewalls</text>
<circle cx="261" cy="119" r="3" fill="#123a6d"/>
<text x="272" y="123" font-size="13" font-weight="400" fill="#1d2733" text-anchor="start">Jump hosts, remote access</text>
<circle cx="261" cy="142" r="3" fill="#123a6d"/>
<text x="272" y="146" font-size="13" font-weight="400" fill="#1d2733" text-anchor="start">Engineering workstations</text>
<circle cx="261" cy="165" r="3" fill="#123a6d"/>
<text x="272" y="169" font-size="13" font-weight="400" fill="#1d2733" text-anchor="start">Historians, data diodes</text>
<circle cx="261" cy="188" r="3" fill="#123a6d"/>
<text x="272" y="192" font-size="13" font-weight="400" fill="#1d2733" text-anchor="start">File transfer, update servers</text>
<circle cx="261" cy="211" r="3" fill="#123a6d"/>
<text x="272" y="215" font-size="13" font-weight="400" fill="#1d2733" text-anchor="start">Shared identity and trusts</text>
<circle cx="261" cy="234" r="3" fill="#123a6d"/>
<text x="272" y="238" font-size="13" font-weight="400" fill="#1d2733" text-anchor="start">Backups of OT configurations</text>
<rect x="540" y="20" width="200" height="250" rx="6" fill="#ffffff" stroke="#d9d3c4" stroke-width="1.5"/>
<text x="556" y="48" font-size="16" font-weight="700" fill="#1d2733" text-anchor="start">OT</text>
<text x="556" y="68" font-size="13" font-weight="400" fill="#5d6975" text-anchor="start">The operator decides</text>
<circle cx="561" cy="96" r="3" fill="#5d6975"/>
<text x="572" y="100" font-size="13" font-weight="400" fill="#1d2733" text-anchor="start">Control systems</text>
<circle cx="561" cy="119" r="3" fill="#5d6975"/>
<text x="572" y="123" font-size="13" font-weight="400" fill="#1d2733" text-anchor="start">Safety systems</text>
<circle cx="561" cy="142" r="3" fill="#5d6975"/>
<text x="572" y="146" font-size="13" font-weight="400" fill="#1d2733" text-anchor="start">Field devices</text>
<path d="M222,240 L238,240" fill="none" stroke="#8a1f2d" stroke-width="2" marker-end="url(#arr)"/>
<text x="130" y="255" font-size="12" font-weight="600" fill="#8a1f2d" text-anchor="middle">most attacks come this way</text>
<path d="M522,240 L538,240" fill="none" stroke="#8a1f2d" stroke-width="2" marker-end="url(#arr)"/>
<text x="20" y="306" font-size="15" font-weight="700" fill="#1d2733" text-anchor="start">Who decides containment at the boundary</text>
<rect x="22" y="318" width="140" height="4" rx="2" fill="#123a6d"/>
<text x="24" y="340" font-size="12" font-weight="700" fill="#123a6d" text-anchor="start">CDC</text>
<rect x="166" y="318" width="140" height="4" rx="2" fill="#123a6d"/>
<text x="168" y="340" font-size="12" font-weight="700" fill="#123a6d" text-anchor="start">CDC, OT approves</text>
<rect x="310" y="318" width="140" height="4" rx="2" fill="#8a1f2d"/>
<text x="312" y="340" font-size="12" font-weight="700" fill="#8a1f2d" text-anchor="start">OT, CDC advises</text>
<rect x="454" y="318" width="140" height="4" rx="2" fill="#8a1f2d"/>
<text x="456" y="340" font-size="12" font-weight="700" fill="#8a1f2d" text-anchor="start">OT management</text>
<rect x="598" y="318" width="140" height="4" rx="2" fill="#8a1f2d"/>
<text x="600" y="340" font-size="12" font-weight="700" fill="#8a1f2d" text-anchor="start">OT, vendor procedure</text>
<rect x="22" y="352" width="140" height="54" rx="6" fill="#ffffff" stroke="#123a6d" stroke-width="1.2"/>
<text x="32" y="369" font-size="12" font-weight="700" fill="#123a6d" text-anchor="start">OTX-01</text>
<text x="32" y="385" font-size="12" font-weight="400" fill="#1d2733" text-anchor="start">Cut supplier</text>
<text x="32" y="400" font-size="12" font-weight="400" fill="#1d2733" text-anchor="start">remote access</text>
<rect x="22" y="412" width="140" height="54" rx="6" fill="#ffffff" stroke="#123a6d" stroke-width="1.2"/>
<text x="32" y="429" font-size="12" font-weight="700" fill="#123a6d" text-anchor="start">OTX-02</text>
<text x="32" y="445" font-size="12" font-weight="400" fill="#1d2733" text-anchor="start">Disable IT accounts</text>
<text x="32" y="460" font-size="12" font-weight="400" fill="#1d2733" text-anchor="start">with DMZ access</text>
<rect x="166" y="352" width="140" height="54" rx="6" fill="#ffffff" stroke="#123a6d" stroke-width="1.2"/>
<text x="176" y="369" font-size="12" font-weight="700" fill="#123a6d" text-anchor="start">OTX-03</text>
<text x="176" y="385" font-size="12" font-weight="400" fill="#1d2733" text-anchor="start">Block a single</text>
<text x="176" y="400" font-size="12" font-weight="400" fill="#1d2733" text-anchor="start">conduit</text>
<rect x="310" y="352" width="140" height="54" rx="6" fill="#ffffff" stroke="#8a1f2d" stroke-width="1.2"/>
<text x="320" y="369" font-size="12" font-weight="700" fill="#8a1f2d" text-anchor="start">OTX-04</text>
<text x="320" y="385" font-size="12" font-weight="400" fill="#1d2733" text-anchor="start">Isolate an engineering</text>
<text x="320" y="400" font-size="12" font-weight="400" fill="#1d2733" text-anchor="start">workstation</text>
<rect x="454" y="352" width="140" height="54" rx="6" fill="#ffffff" stroke="#8a1f2d" stroke-width="1.2"/>
<text x="464" y="369" font-size="12" font-weight="700" fill="#8a1f2d" text-anchor="start">OTX-05</text>
<text x="464" y="385" font-size="12" font-weight="400" fill="#1d2733" text-anchor="start">Separate IT</text>
<text x="464" y="400" font-size="12" font-weight="400" fill="#1d2733" text-anchor="start">from OT</text>
<rect x="598" y="352" width="140" height="54" rx="6" fill="#ffffff" stroke="#8a1f2d" stroke-width="1.2"/>
<text x="608" y="369" font-size="12" font-weight="700" fill="#8a1f2d" text-anchor="start">OTX-06</text>
<text x="608" y="385" font-size="12" font-weight="400" fill="#1d2733" text-anchor="start">Isolate, reboot or</text>
<text x="608" y="400" font-size="12" font-weight="400" fill="#1d2733" text-anchor="start">image an OT asset</text>
<rect x="20" y="476" width="720" height="34" rx="6" fill="#f6e7e9" stroke="#8a1f2d" stroke-width="1"/>
<text x="380" y="498" font-size="13" font-weight="600" fill="#1d2733" text-anchor="middle">Reporting: one owner per incident. The clock starts at awareness on either side.</text>
</svg>
