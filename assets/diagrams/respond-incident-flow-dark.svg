<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" width="760" height="640" role="img" aria-labelledby="title desc" font-family="'IBM Plex Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="title">How an incident moves</title>
<desc id="desc">Prepare, then detect, then a verify-and-triage gate with three outcomes: continue, stop or defer. Continue enters the response loop of scope, contain, eradicate and recover, repeated until no new evidence appears. Leaving the loop is a written, named decision, followed by a debrief whose lessons feed back into preparation. Legal clocks run from awareness, not from declaration.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa7b4"/></marker><marker id="arr-eu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8fb3e3"/></marker></defs>
<rect x="20" y="40" width="190" height="64" rx="6" fill="#1a242f" stroke="#3a4a5b" stroke-width="1.5"/>
<text x="115.0" y="69.0" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">Prepare</text>
<text x="115.0" y="87.0" font-size="12" font-weight="400" fill="#9aa7b4" text-anchor="middle">plan, playbooks, authority</text>
<rect x="250" y="40" width="190" height="64" rx="6" fill="#1a242f" stroke="#3a4a5b" stroke-width="1.5"/>
<text x="345.0" y="69.0" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">Detect</text>
<text x="345.0" y="87.0" font-size="12" font-weight="400" fill="#9aa7b4" text-anchor="middle">alert, hunt or report</text>
<rect x="480" y="40" width="260" height="64" rx="6" fill="#3a2329" stroke="#e39aa4" stroke-width="2"/>
<text x="610.0" y="69.0" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">Verify and triage</text>
<text x="610.0" y="87.0" font-size="12" font-weight="400" fill="#9aa7b4" text-anchor="middle">is it an incident?</text>
<text x="610" y="28" font-size="13" font-weight="600" fill="#e39aa4" text-anchor="middle">Legal clocks run from awareness</text>
<path d="M210,72 L248,72" fill="none" stroke="#9aa7b4" stroke-width="1.6" marker-end="url(#arr)"/>
<path d="M440,72 L478,72" fill="none" stroke="#9aa7b4" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="505" y="150" width="110" height="56" rx="6" fill="#1a242f" stroke="#3a4a5b" stroke-width="1.5"/>
<text x="560.0" y="175.0" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">Stop</text>
<text x="560.0" y="193.0" font-size="12" font-weight="400" fill="#9aa7b4" text-anchor="middle">reason recorded</text>
<rect x="630" y="150" width="110" height="56" rx="6" fill="#1a242f" stroke="#3a4a5b" stroke-width="1.5"/>
<text x="685.0" y="175.0" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">Defer</text>
<text x="685.0" y="193.0" font-size="12" font-weight="400" fill="#9aa7b4" text-anchor="middle">time-boxed</text>
<path d="M560,104 L560,148" fill="none" stroke="#9aa7b4" stroke-width="1.6" marker-end="url(#arr)"/>
<path d="M660,104 L660,148" fill="none" stroke="#9aa7b4" stroke-width="1.6" marker-end="url(#arr)"/>
<path d="M715,150 L715,106" fill="none" stroke="#9aa7b4" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#arr)"/>
<circle cx="290" cy="355" r="125" fill="none" stroke="#8fb3e3" stroke-width="2"/>
<path d="M384.0,437.7 L377.0,444.8" fill="none" stroke="#8fb3e3" stroke-width="2" marker-end="url(#arr-eu)"/>
<path d="M207.3,449.0 L200.2,442.0" fill="none" stroke="#8fb3e3" stroke-width="2" marker-end="url(#arr-eu)"/>
<path d="M196.0,272.3 L203.0,265.2" fill="none" stroke="#8fb3e3" stroke-width="2" marker-end="url(#arr-eu)"/>
<path d="M372.7,261.0 L379.8,268.0" fill="none" stroke="#8fb3e3" stroke-width="2" marker-end="url(#arr-eu)"/>
<text x="290" y="343" font-size="16" font-weight="600" fill="#8fb3e3" text-anchor="middle">Response loop</text>
<text x="290" y="363" font-size="13" font-weight="400" fill="#9aa7b4" text-anchor="middle">until no new</text>
<text x="290" y="381" font-size="13" font-weight="400" fill="#9aa7b4" text-anchor="middle">evidence appears</text>
<rect x="236" y="210" width="108" height="40" rx="6" fill="#26354a" stroke="#8fb3e3" stroke-width="1.5"/>
<text x="290.0" y="235.0" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">Scope</text>
<rect x="361" y="335" width="108" height="40" rx="6" fill="#26354a" stroke="#8fb3e3" stroke-width="1.5"/>
<text x="415.0" y="360.0" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">Contain</text>
<rect x="236" y="460" width="108" height="40" rx="6" fill="#26354a" stroke="#8fb3e3" stroke-width="1.5"/>
<text x="290.0" y="485.0" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">Eradicate</text>
<rect x="111" y="335" width="108" height="40" rx="6" fill="#26354a" stroke="#8fb3e3" stroke-width="1.5"/>
<text x="165.0" y="360.0" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">Recover</text>
<path d="M490,104 L490,230 L346,230" fill="none" stroke="#8fb3e3" stroke-width="1.6" marker-end="url(#arr-eu)"/>
<text x="482" y="150" font-size="13" font-weight="600" fill="#8fb3e3" text-anchor="end">Continue</text>
<rect x="492" y="270" width="248" height="168" rx="6" fill="#1a242f" stroke="#3a4a5b" stroke-width="1.5"/>
<text x="506" y="296" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="start">Start another pass when</text>
<circle cx="511" cy="318" r="3" fill="#8fb3e3"/>
<text x="522" y="322" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start">a new indicator of compromise</text>
<circle cx="511" cy="342" r="3" fill="#8fb3e3"/>
<text x="522" y="346" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start">a known indicator out of scope</text>
<circle cx="511" cy="366" r="3" fill="#8fb3e3"/>
<text x="522" y="370" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start">eradication fails, reinfection</text>
<circle cx="511" cy="390" r="3" fill="#8fb3e3"/>
<text x="522" y="394" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start">the compromise started earlier</text>
<circle cx="511" cy="414" r="3" fill="#8fb3e3"/>
<text x="522" y="418" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start">an authority or insurer asks</text>
<path d="M165,375 L165,528" fill="none" stroke="#9aa7b4" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="70" y="530" width="190" height="58" rx="6" fill="#1a242f" stroke="#3a4a5b" stroke-width="1.5"/>
<text x="165.0" y="556.0" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">Exit decision</text>
<text x="165.0" y="574.0" font-size="12" font-weight="400" fill="#9aa7b4" text-anchor="middle">written and named</text>
<rect x="330" y="530" width="240" height="58" rx="6" fill="#8fb3e3"/>
<text x="450.0" y="556.0" font-size="14" font-weight="600" fill="#0d1720" text-anchor="middle">Debrief</text>
<text x="450.0" y="574.0" font-size="12" font-weight="400" fill="#0d1720" text-anchor="middle">root cause, actions, reports</text>
<path d="M260,559 L328,559" fill="none" stroke="#9aa7b4" stroke-width="1.6" marker-end="url(#arr)"/>
<path d="M450,588 L450,618 L40,618 L40,106" fill="none" stroke="#9aa7b4" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="470" y="623" font-size="13" font-weight="400" fill="#9aa7b4" text-anchor="start">Lessons feed the next preparation</text>
</svg>
