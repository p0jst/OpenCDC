<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" height="480" role="img" aria-labelledby="title desc" font-family="'IBM Plex Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="title">The first 90 days</title>
<desc id="desc">Week by week: charter drafted in weeks 1 to 2; regulatory applicability register in weeks 1 to 4; operating model decided in weeks 2 to 6; crown jewels agreed in weeks 3 to 8; MFA, a tested backup and admin-path segmentation in weeks 4 to 10; identity, endpoint and email logs onboarded in weeks 6 to 12; incident response plan, playbooks and a reporting drill in weeks 8 to 12; baseline maturity assessment in week 12. Charter sign-off and the reporting drill depend on decisions by others; MFA and log onboarding depend on work by other teams.</desc>
