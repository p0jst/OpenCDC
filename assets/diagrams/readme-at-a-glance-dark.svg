<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="title desc" font-family="'IBM Plex Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="title">OCDF at a glance</title>
<desc id="desc">Every capability is described three ways: what, in six functions; how much, by tier Essential, Standard or Advanced; and how well, on maturity levels 1 to 4. GOVERN spans the other five functions, IDENTIFY, PROTECT, DETECT, RESPOND and RECOVER, and lessons from RECOVER feed IDENTIFY. Underneath sits the regulatory layer: NIS2, DORA, GDPR, CRA, CER and the AI Act, with annexes for all 27 EU member states.</desc>
