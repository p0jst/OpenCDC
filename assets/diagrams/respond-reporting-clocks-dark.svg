<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 456" width="760" height="456" role="img" aria-labelledby="title desc" font-family="'IBM Plex Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="title">EU reporting clocks after an incident</title>
<desc id="desc">Deadlines counted from awareness unless noted. NIS2: early warning within 24 hours, incident notification within 72 hours, final report one month after the notification, and the recipients of your services without undue delay. GDPR: supervisory authority within 72 hours, data subjects without undue delay if the risk is high. DORA: initial notification within 4 hours of classification as major and at the latest 24 hours from awareness, intermediate within 72 hours, final within one month. CER: initial notification within 24 hours, detailed report within one month.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa7b4"/></marker><marker id="arr-eu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8fb3e3"/></marker></defs>
<text x="20" y="30" font-size="15" font-weight="600" fill="#e39aa4" text-anchor="start">From awareness</text>
<text x="20" y="50" font-size="13" font-weight="400" fill="#9aa7b4" text-anchor="start">Columns are steps, not to scale</text>
<text x="209.0" y="72" font-size="12" font-weight="600" fill="#e6edf3" text-anchor="middle">Without undue delay</text>
<line x1="209.0" y1="82" x2="209.0" y2="390" stroke="#3a4a5b" stroke-dasharray="2 4"/>
<text x="327.0" y="72" font-size="14" font-weight="700" fill="#e6edf3" text-anchor="middle">4 h</text>
<line x1="327.0" y1="82" x2="327.0" y2="390" stroke="#3a4a5b" stroke-dasharray="2 4"/>
<text x="445.0" y="72" font-size="14" font-weight="700" fill="#e6edf3" text-anchor="middle">24 h</text>
<line x1="445.0" y1="82" x2="445.0" y2="390" stroke="#3a4a5b" stroke-dasharray="2 4"/>
<text x="563.0" y="72" font-size="14" font-weight="700" fill="#e6edf3" text-anchor="middle">72 h</text>
<line x1="563.0" y1="82" x2="563.0" y2="390" stroke="#3a4a5b" stroke-dasharray="2 4"/>
<text x="681.0" y="72" font-size="14" font-weight="700" fill="#e6edf3" text-anchor="middle">1 month</text>
<line x1="681.0" y1="82" x2="681.0" y2="390" stroke="#3a4a5b" stroke-dasharray="2 4"/>
<text x="20" y="118" font-size="16" font-weight="700" fill="#8fb3e3" text-anchor="start">NIS2</text>
<text x="20" y="137" font-size="12" font-weight="400" fill="#9aa7b4" text-anchor="start">Art. 23</text>
<line x1="209.0" y1="110" x2="681.0" y2="110" stroke="#8fb3e3" stroke-width="2"/>
<circle cx="445.0" cy="110" r="7" fill="#8fb3e3" stroke="#8fb3e3" stroke-width="2"/>
<text x="445.0" y="136" font-size="12" font-weight="600" fill="#e6edf3" text-anchor="middle">Early warning</text>
<text x="445.0" y="151" font-size="12" font-weight="400" fill="#9aa7b4" text-anchor="middle">CSIRT or authority</text>
<circle cx="563.0" cy="110" r="7" fill="#8fb3e3" stroke="#8fb3e3" stroke-width="2"/>
<text x="563.0" y="136" font-size="12" font-weight="600" fill="#e6edf3" text-anchor="middle">Incident notification</text>
<circle cx="681.0" cy="110" r="7" fill="#8fb3e3" stroke="#8fb3e3" stroke-width="2"/>
<text x="681.0" y="136" font-size="12" font-weight="600" fill="#e6edf3" text-anchor="middle">Final report</text>
<text x="681.0" y="151" font-size="12" font-weight="400" fill="#9aa7b4" text-anchor="middle">from notification</text>
<circle cx="209.0" cy="110" r="7" fill="#1a242f" stroke="#8fb3e3" stroke-width="2"/>
<text x="209.0" y="136" font-size="12" font-weight="600" fill="#e6edf3" text-anchor="middle">Recipients of</text>
<text x="209.0" y="151" font-size="12" font-weight="400" fill="#9aa7b4" text-anchor="middle">your services</text>
<line x1="20" y1="162" x2="740" y2="162" stroke="#3a4a5b"/>
<text x="20" y="196" font-size="16" font-weight="700" fill="#8fb3e3" text-anchor="start">GDPR</text>
<text x="20" y="215" font-size="12" font-weight="400" fill="#9aa7b4" text-anchor="start">Art. 33–34</text>
<line x1="209.0" y1="188" x2="563.0" y2="188" stroke="#8fb3e3" stroke-width="2"/>
<circle cx="563.0" cy="188" r="7" fill="#8fb3e3" stroke="#8fb3e3" stroke-width="2"/>
<text x="563.0" y="214" font-size="12" font-weight="600" fill="#e6edf3" text-anchor="middle">Supervisory</text>
<text x="563.0" y="229" font-size="12" font-weight="400" fill="#9aa7b4" text-anchor="middle">authority</text>
<circle cx="209.0" cy="188" r="7" fill="#1a242f" stroke="#8fb3e3" stroke-width="2"/>
<text x="209.0" y="214" font-size="12" font-weight="600" fill="#e6edf3" text-anchor="middle">Data subjects,</text>
<text x="209.0" y="229" font-size="12" font-weight="400" fill="#9aa7b4" text-anchor="middle">if high risk</text>
<line x1="20" y1="240" x2="740" y2="240" stroke="#3a4a5b"/>
<text x="20" y="274" font-size="16" font-weight="700" fill="#8fb3e3" text-anchor="start">DORA</text>
<text x="20" y="293" font-size="12" font-weight="400" fill="#9aa7b4" text-anchor="start">Art. 19, finance</text>
<line x1="327.0" y1="266" x2="681.0" y2="266" stroke="#8fb3e3" stroke-width="2"/>
<circle cx="327.0" cy="266" r="7" fill="#8fb3e3" stroke="#8fb3e3" stroke-width="2"/>
<text x="327.0" y="292" font-size="12" font-weight="600" fill="#e6edf3" text-anchor="middle">Initial, from</text>
<text x="327.0" y="307" font-size="12" font-weight="400" fill="#9aa7b4" text-anchor="middle">classification</text>
<circle cx="445.0" cy="266" r="7" fill="#8fb3e3" stroke="#8fb3e3" stroke-width="2"/>
<text x="445.0" y="292" font-size="12" font-weight="600" fill="#e6edf3" text-anchor="middle">Initial at the</text>
<text x="445.0" y="307" font-size="12" font-weight="400" fill="#9aa7b4" text-anchor="middle">latest</text>
<circle cx="563.0" cy="266" r="7" fill="#8fb3e3" stroke="#8fb3e3" stroke-width="2"/>
<text x="563.0" y="292" font-size="12" font-weight="600" fill="#e6edf3" text-anchor="middle">Intermediate</text>
<text x="563.0" y="307" font-size="12" font-weight="400" fill="#9aa7b4" text-anchor="middle">report</text>
<circle cx="681.0" cy="266" r="7" fill="#8fb3e3" stroke="#8fb3e3" stroke-width="2"/>
<text x="681.0" y="292" font-size="12" font-weight="600" fill="#e6edf3" text-anchor="middle">Final report</text>
<line x1="20" y1="318" x2="740" y2="318" stroke="#3a4a5b"/>
<text x="20" y="352" font-size="16" font-weight="700" fill="#8fb3e3" text-anchor="start">CER</text>
<text x="20" y="371" font-size="12" font-weight="400" fill="#9aa7b4" text-anchor="start">Art. 15, critical</text>
<line x1="445.0" y1="344" x2="681.0" y2="344" stroke="#8fb3e3" stroke-width="2"/>
<circle cx="445.0" cy="344" r="7" fill="#8fb3e3" stroke="#8fb3e3" stroke-width="2"/>
<text x="445.0" y="370" font-size="12" font-weight="600" fill="#e6edf3" text-anchor="middle">Initial</text>
<text x="445.0" y="385" font-size="12" font-weight="400" fill="#9aa7b4" text-anchor="middle">notification</text>
<circle cx="681.0" cy="344" r="7" fill="#8fb3e3" stroke="#8fb3e3" stroke-width="2"/>
<text x="681.0" y="370" font-size="12" font-weight="600" fill="#e6edf3" text-anchor="middle">Detailed report</text>
<text x="20" y="432" font-size="12" font-weight="400" fill="#9aa7b4" text-anchor="start">Open circle: without undue delay. National law may add recipients or detail;</text>
<text x="20" y="448" font-size="12" font-weight="400" fill="#9aa7b4" text-anchor="start">check your annex. Not legal advice.</text>
</svg>
