<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 445" width="760" height="445" role="img" aria-labelledby="title desc" font-family="'IBM Plex Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="title">Triage outcomes and how cases close</title>
<desc id="desc">Triage has three outcomes. Continue leads to a true positive with impact, which enters the response loop with reporting duties assessed, or a true positive without impact, closed after a scoping check. Stop leads to a false positive, either a rule defect, which is tuned, or benign activity, which is closed and given an exception with owner and expiry if it recurs. Defer leads to indeterminate when the time-box runs out; the missing data goes to the backlog.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d6975"/></marker><marker id="arr-eu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#123a6d"/></marker></defs>
<rect x="20" y="178" width="130" height="64" rx="6" fill="#123a6d"/>
<text x="85.0" y="207.0" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Triage</text>
<text x="85.0" y="225.0" font-size="12" font-weight="400" fill="#ffffff" text-anchor="middle">the minimum record</text>
<rect x="200" y="20" width="110" height="130" rx="6" fill="#ffffff" stroke="#123a6d" stroke-width="2"/>
<text x="255" y="90.0" font-size="15" font-weight="700" fill="#123a6d" text-anchor="middle">Continue</text>
<path d="M150,210 L176,210 L176,85.0 L198,85.0" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="340" y="20" width="400" height="60" rx="6" fill="#ffffff" stroke="#d9d3c4" stroke-width="1.5"/>
<text x="356" y="45" font-size="14" font-weight="600" fill="#1d2733" text-anchor="start">True positive, impact</text>
<text x="356" y="65" font-size="13" font-weight="400" fill="#5d6975" text-anchor="start">Response loop; assess reporting</text>
<path d="M310,85.0 L324,85.0 L324,50 L338,50" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="340" y="90" width="400" height="60" rx="6" fill="#ffffff" stroke="#d9d3c4" stroke-width="1.5"/>
<text x="356" y="115" font-size="14" font-weight="600" fill="#1d2733" text-anchor="start">True positive, no impact</text>
<text x="356" y="135" font-size="13" font-weight="400" fill="#5d6975" text-anchor="start">Scoping check, then close</text>
<path d="M310,85.0 L324,85.0 L324,120 L338,120" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="200" y="180" width="110" height="130" rx="6" fill="#ffffff" stroke="#8a1f2d" stroke-width="2"/>
<text x="255" y="250.0" font-size="15" font-weight="700" fill="#8a1f2d" text-anchor="middle">Stop</text>
<path d="M150,210 L176,210 L176,245.0 L198,245.0" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="340" y="180" width="400" height="60" rx="6" fill="#ffffff" stroke="#d9d3c4" stroke-width="1.5"/>
<text x="356" y="205" font-size="14" font-weight="600" fill="#1d2733" text-anchor="start">False positive: rule defect</text>
<text x="356" y="225" font-size="13" font-weight="400" fill="#5d6975" text-anchor="start">Flag for tuning; fix the rule</text>
<path d="M310,245.0 L324,245.0 L324,210 L338,210" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="340" y="250" width="400" height="60" rx="6" fill="#ffffff" stroke="#d9d3c4" stroke-width="1.5"/>
<text x="356" y="275" font-size="14" font-weight="600" fill="#1d2733" text-anchor="start">False positive: benign</text>
<text x="356" y="295" font-size="13" font-weight="400" fill="#5d6975" text-anchor="start">Close; exception if it recurs</text>
<path d="M310,245.0 L324,245.0 L324,280 L338,280" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="200" y="340" width="110" height="60" rx="6" fill="#ffffff" stroke="#6b4e16" stroke-width="2"/>
<text x="255" y="375.0" font-size="15" font-weight="700" fill="#6b4e16" text-anchor="middle">Defer</text>
<path d="M150,210 L176,210 L176,370.0 L198,370.0" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="340" y="340" width="400" height="60" rx="6" fill="#ffffff" stroke="#d9d3c4" stroke-width="1.5"/>
<text x="356" y="365" font-size="14" font-weight="600" fill="#1d2733" text-anchor="start">Indeterminate</text>
<text x="356" y="385" font-size="13" font-weight="400" fill="#5d6975" text-anchor="start">Missing data to the backlog</text>
<path d="M310,370.0 L324,370.0 L324,370 L338,370" fill="none" stroke="#5d6975" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="20" y="436" font-size="12" font-weight="400" fill="#5d6975" text-anchor="start">Every false positive carries its reason: a defect is fixed in the rule, benign activity is not.</text>
</svg>
