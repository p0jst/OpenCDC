<rect x="623.1818181818182" y="364" width="63.45454545454545" height="40" rx="2" fill="#26354a" stroke="#8fb3e3" stroke-width="1"/>
<text x="654.909090909091" y="389" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">Lead 1</text>
<text x="556.7272727272726" y="389" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">Engineering 1–2</text>
<line x1="20.0" y1="408" x2="20.0" y2="414" stroke="#9aa7b4"/>
<text x="20.0" y="429" font-size="12" font-weight="400" fill="#9aa7b4" text-anchor="middle">0</text>
