<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" height="480" role="img" aria-labelledby="title desc" font-family="'IBM Plex Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="title">Why one 24/7 seat takes about 5.6 people</title>
<desc id="desc">Example with a Danish full-time contract. One person has 1,924 contract hours a year; after 185 hours of leave, 67 of public holidays, 59 of sickness and 37 of training, 1,576 hours remain. Covering one seat around the clock takes 8,760 hours, which is 5.6 people at 1,576 hours each. A 24/7 line with a second daytime seat, detection engineering and a lead comes to about 9 to 10 people.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa7b4"/></marker><marker id="arr-eu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8fb3e3"/></marker></defs>
<text x="20" y="28" font-size="16" font-weight="600" fill="#e6edf3" text-anchor="start">One full-time person, one year</text>
<text x="20" y="48" font-size="13" font-weight="400" fill="#9aa7b4" text-anchor="start">Danish 37-hour contract as the example; use your own numbers</text>
<rect x="20" y="76" width="589.7713097713098" height="40" rx="2" fill="#8fb3e3"/>
<text x="34" y="102" font-size="15" font-weight="600" fill="#0d1720" text-anchor="start">Available 1,576 h</text>
<rect x="609.7713097713098" y="76" width="69.23076923076924" height="40" rx="2" fill="#3a2329" stroke="#1a242f" stroke-width="1"/>
<rect x="679.0020790020791" y="76" width="25.072765072765073" height="40" rx="2" fill="#3a2329" stroke="#1a242f" stroke-width="1"/>
<rect x="704.0748440748441" y="76" width="22.07900207900208" height="40" rx="2" fill="#3a2329" stroke="#1a242f" stroke-width="1"/>
<rect x="726.1538461538462" y="76" width="13.846153846153847" height="40" rx="2" fill="#3a2329" stroke="#1a242f" stroke-width="1"/>
<text x="740" y="68" font-size="13" font-weight="400" fill="#9aa7b4" text-anchor="end">1,924 contract hours</text>
<path d="M611.7713097713098,122 l0,6 L740,128 l0,-6" fill="none" stroke="#9aa7b4"/>
<text x="740" y="146" font-size="13" font-weight="400" fill="#9aa7b4" text-anchor="end">Leave 185 · Holidays 67 · Sickness 59 · Training 37</text>
<text x="20" y="192" font-size="16" font-weight="600" fill="#e6edf3" text-anchor="start">One seat, around the clock</text>
<text x="20" y="212" font-size="13" font-weight="400" fill="#9aa7b4" text-anchor="start">24 × 365 = 8,760 hours, in blocks of 1,576 hours</text>
<rect x="21.0" y="226" width="127.53424657534245" height="40" rx="2" fill="#8fb3e3"/>
<text x="84.76712328767123" y="251" font-size="14" font-weight="600" fill="#0d1720" text-anchor="middle">Person 1</text>
<rect x="150.53424657534245" y="226" width="127.53424657534245" height="40" rx="2" fill="#8fb3e3"/>
<text x="214.3013698630137" y="251" font-size="14" font-weight="600" fill="#0d1720" text-anchor="middle">Person 2</text>
<rect x="280.0684931506849" y="226" width="127.53424657534245" height="40" rx="2" fill="#8fb3e3"/>
<text x="343.8356164383561" y="251" font-size="14" font-weight="600" fill="#0d1720" text-anchor="middle">Person 3</text>
<rect x="409.6027397260274" y="226" width="127.53424657534245" height="40" rx="2" fill="#8fb3e3"/>
<text x="473.3698630136986" y="251" font-size="14" font-weight="600" fill="#0d1720" text-anchor="middle">Person 4</text>
<rect x="539.1369863013698" y="226" width="127.53424657534245" height="40" rx="2" fill="#8fb3e3"/>
<text x="602.904109589041" y="251" font-size="14" font-weight="600" fill="#0d1720" text-anchor="middle">Person 5</text>
<rect x="668.6712328767123" y="226" width="70.32876712328766" height="40" rx="2" fill="#26354a" stroke="#8fb3e3" stroke-width="1"/>
<text x="703.8356164383562" y="251" font-size="14" font-weight="600" fill="#8fb3e3" text-anchor="middle">0.6</text>
<text x="740" y="290" font-size="15" font-weight="700" fill="#8fb3e3" text-anchor="end">≈ 5.6 people per seat</text>
<text x="20" y="330" font-size="16" font-weight="600" fill="#e6edf3" text-anchor="start">A 24/7 in-house line</text>
<text x="20" y="350" font-size="13" font-weight="400" fill="#9aa7b4" text-anchor="start">People, on a scale of 0 to 11</text>
<rect x="21" y="364" width="364.5454545454545" height="40" rx="2" fill="#8fb3e3"/>
