<text x="281.8181818181818" y="429" font-size="12" font-weight="400" fill="#9aa7b4" text-anchor="middle">4</text>
<line x1="347.27272727272725" y1="408" x2="347.27272727272725" y2="414" stroke="#9aa7b4"/>
<text x="347.27272727272725" y="429" font-size="12" font-weight="400" fill="#9aa7b4" text-anchor="middle">5</text>
<line x1="412.72727272727275" y1="408" x2="412.72727272727275" y2="414" stroke="#9aa7b4"/>
<text x="412.72727272727275" y="429" font-size="12" font-weight="400" fill="#9aa7b4" text-anchor="middle">6</text>
<line x1="478.1818181818182" y1="408" x2="478.1818181818182" y2="414" stroke="#9aa7b4"/>
<text x="478.1818181818182" y="429" font-size="12" font-weight="400" fill="#9aa7b4" text-anchor="middle">7</text>
<line x1="543.6363636363636" y1="408" x2="543.6363636363636" y2="414" stroke="#9aa7b4"/>
<text x="543.6363636363636" y="429" font-size="12" font-weight="400" fill="#9aa7b4" text-anchor="middle">8</text>
<line x1="609.0909090909091" y1="408" x2="609.0909090909091" y2="414" stroke="#9aa7b4"/>
<text x="609.0909090909091" y="429" font-size="12" font-weight="400" fill="#9aa7b4" text-anchor="middle">9</text>
<line x1="674.5454545454545" y1="408" x2="674.5454545454545" y2="414" stroke="#9aa7b4"/>
<text x="674.5454545454545" y="429" font-size="12" font-weight="400" fill="#9aa7b4" text-anchor="middle">10</text>
<line x1="740.0" y1="408" x2="740.0" y2="414" stroke="#9aa7b4"/>
